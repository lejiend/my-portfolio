name: Building the CI

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches: 
      - master  


jobs: 
  bulding-the-continous-integration:
    runs-on: ubuntu-latest
    steps: 
      - name: Check out repository 
        uses: actions/checkout@v4 
    
      - name: Set up Nodejs 
        uses: actions/setup-node@v4 
        with: 
          node-version: 20
          cache: npm 
    
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application 
        run: npm run build
      
      - name: Upload dist directory to artifcat
        uses: actions/upload-artifact@v4 
        with: 
          name: portfolio-dist
          path: dist

  