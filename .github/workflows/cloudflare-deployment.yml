name: Cloudflare Deployment

on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - master  

jobs: 
  build:
    runs-on: ubuntu-latest
    steps: 
      - name: Check out repository 
        uses: actions/checkout@v4 
    
      - name: Set up Nodejs 
        uses: action/setup-node@v4 
        with: 
          node-version: 20
          cache: npm 
    
      - name: Install dependencies
        run: npm ci

      - name: Build application 
        run: npm run build


